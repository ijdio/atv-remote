name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.1, Apple Silicon
    validations:
      required: true
  - type: input
    id: appletv
    attributes:
      label: Apple TV model and tvOS version
      placeholder: e.g. Apple TV 4K (3rd gen), tvOS 26.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: >
        From the terminal, or ~/Library/Logs/atv-remote.log if you use the login item.
        Remove anything private (device names, IP addresses) if you'd rather not share it.
      render: text
