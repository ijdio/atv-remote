name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # macOS runner: the menu bar app imports PyObjC, which only installs on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: Import smoke test
        run: uv run python -c "import atv_remote.menubar, atv_remote.web"
      - name: Login script syntax
        run: bash -n scripts/login-item.sh
