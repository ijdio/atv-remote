version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    ignore:
      # pyatv 0.18.0 breaks PIN pairing with srptools 2.x (see pyproject.toml).
      # Remove once pyatv supports it.
      - dependency-name: srptools
        versions: [">=2"]
